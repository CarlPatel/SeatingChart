<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seating Chart Generator</title>
  <style>
    body {
      background-color: #f7f7f7;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      color: #333;
    }

    .container {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      padding: 20px;
      width: 90%;
      max-width: 900px;
      margin: 40px auto;
      text-align: center;
    }

    h1 {
      color: #61b5e3;
    }

    label[for="students"] {
      display: block;
      margin-bottom: 10px;
      font-size: 1.1em;
    }

    textarea {
      width: 50%;
      height: 150px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      resize: vertical;
      font-size: 1em;
      margin: 0 auto;
      display: block;
      text-align: center;
    }

    /* Counter styling */
    #nameCount {
      width: 50%;
      margin: 10px auto;
      font-weight: bold;
      text-align: center;
    }

    .options {
      margin-top: 10px;
    }

    .options label {
      margin-right: 20px;
      font-weight: bold;
      font-size: 1em;
      cursor: pointer;
    }

    .extra-input {
      margin-top: 10px;
    }

    .extra-input label {
      margin-right: 15px;
      font-size: 0.9em;
    }

    input[type="number"] {
      padding: 5px;
      border: 1px solid #ccc;
      border-radius: 4px;
      width: 60px;
      margin-left: 5px;
    }

    button {
      background-color: #61b5e3;
      color: #fff;
      border: none;
      padding: 10px 20px;
      margin: 10px 5px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1em;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #61aae3;
    }

    .seating-chart {
      display: grid;
      grid-column-gap: 10px;
      grid-row-gap: 10px;
      grid-auto-rows: 60px;
      justify-content: center;
      margin: 20px auto 0;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .seat {
      border: 1px solid #333;
      background-color: #f9f9f9;
      cursor: move;
      width: 100px;
      height: 60px;
      box-sizing: border-box;
      padding: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      white-space: normal;
      line-height: 1.2;
      overflow: hidden;
      border-radius: 4px;
    }

    /* Fixed width for groups */
    .group {
      border: 2px solid #666;
      margin: 10px;
      padding: 10px;
      width: 150px;
      border-radius: 6px;
      text-align: center;
    }

    .group-title {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .class-title {
      font-size: 1.4em;
      font-weight: 700;
      margin: 30px 0 0;
      text-align: center;
    }

    /* Vertical layout for seats within a group */
    .group-seats {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
      align-items: center;
    }

    /* Modal overlay */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 9999; }
    .modal { background: #fff; border-radius: 8px; padding: 16px; width: min(700px, 90vw); max-height: 80vh; overflow: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
    .modal h2 { margin: 0 0 10px; font-size: 1.5rem; color: #333; }
    .student-row { display: grid; grid-template-columns: 1fr 120px 120px; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid #eee; }
    .student-row input[type="text"] { width: 100%; padding: 6px; border: 1px solid #ccc; border-radius: 4px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
    .muted { color: #666; font-size: 0.9em; }
    .add-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 6px; align-items: stretch; }

    /* Modal input styling */
    .modal input[type="text"],
    .modal input[type="search"],
    .modal input[type="email"],
    .modal input[type="number"],
    .modal textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      border: 1px solid #cfcfcf;
      border-radius: 6px;
      background: #fafafa;
      font-size: 14px;
      line-height: 1.3;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
    }

    /* Ensure inputs match button height and keep buttons inline */
    .modal input[type="text"],
    .modal input[type="search"],
    .modal input[type="email"],
    .modal input[type="number"] {
      height: 40px;
    }
    .modal button {
      width: auto !important;
      display: inline-flex !important;
      align-items: center;
      justify-content: center;
      height: 40px;
      padding: 0 16px;
      white-space: nowrap;
    }

    .modal input[type="text"]::placeholder,
    .modal textarea::placeholder {
      color: #9aa0a6;
    }

    .modal input[type="text"]:focus,
    .modal input[type="search"]:focus,
    .modal input[type="email"]:focus,
    .modal input[type="number"]:focus,
    .modal textarea:focus {
      outline: none;
      border-color: #61b5e3;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(97, 181, 227, 0.25);
    }

    /* Compact inputs inside list rows */
    .student-row input[type="text"] {
      padding: 6px 8px;
      font-size: 14px;
      background: #fff;
    }

    /* Add-row input sizing */
    .add-row input[type="text"] {
      padding: 8px 10px;
      font-size: 14px;
      background: #fff;
      align-self: center;
    }

    @media print {
      .no-print {
        display: none;
      }

      .seat {
        cursor: default;
      }

      .group {
        width: auto;
        max-width: 100%;
        margin: 5px;
        padding: 5px;
      }

      .container {
        box-shadow: none;
      }
      /* Hide Manage Students button when printing */
      #manageBtn { display: none !important; }
    }

    @media (max-width: 768px) {
      .container {
        width: auto;
        padding: 15px;
        margin: 20px 10px;
      }

      textarea,
      #nameCount {
        width: 75%;
      }

      .extra-input {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .extra-input label {
        margin: 5px 0;
      }

      .seating-chart {
        gap: 8px;
      }

      .seat {
        width: 80px;
        height: 50px;
        font-size: 0.85em;
      }

      .group {
        width: auto;
        max-width: 90%;
      }

      button {
        width: 90%;
        margin: 10px auto;
        display: block;
      }
      /* Keep modal controls on a single row on mobile */
      .modal button { width: auto; display: inline-flex; }
      .add-row { grid-template-columns: 1fr auto; }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1 class="no-print">Seating Chart Generator</h1>
    <div class="no-print">
      <label for="students">Enter student names (one per line):</label>
      <textarea id="students" placeholder="Student 1&#10;Student 2&#10;Student 3"></textarea>
      <div id="nameCount">Students: 0</div>
      <br />
      <div class="options">
        <label>
          <input type="radio" name="layout" value="grid" checked>
          Grid
        </label>
        <label>
          <input type="radio" name="layout" value="groups">
          Groups
        </label>
      </div>
      <div id="grid-options" class="extra-input">
        <label>Rows: <input type="number" id="rows" min="1" value="4"></label>
        <label>Columns: <input type="number" id="columns" min="1" value="5"></label>
      </div>
      <div id="group-options" class="extra-input" style="display:none;">
        <label>Group Size: <input type="number" id="groupSize" min="1" value="4"></label>
      </div>
      <button id="generate">Generate Seating Chart</button>
      <button id="printBtn">Print/Export</button>
      <button id="saveBtn">Save</button>
      <button id="loadBtn">Load</button>
      <input type="file" id="loadFile" accept="application/json" style="display:none" />
    </div>
    <div id="classTitle" class="class-title" contenteditable="true" title="Click to edit class name" style="display:none;">Class Name</div>
    <div style="overflow-x: auto;">
      <div id="chart" class="seating-chart"></div>
    </div>
    <button id="manageBtn" style="display:none;">Manage Individual Students</button>

    <!-- Student Manager Modal -->
    <div id="studentModal" class="modal-overlay">
      <div class="modal">
        <h2>Manage Students </h2>
        <span class="muted">add/rename/delete without reshuffling</span>
        <div id="studentList"></div>
        <div class="add-row">
          <input id="addStudentInput" type="text" placeholder="Add a student" />
          <button id="addStudentBtn" type="button">Add Student</button>
        </div>
        <div class="modal-actions">
          <button id="closeStudentModal" type="button">Close</button>
        </div>
      </div>
    </div>
  </div>
  <script>
    // Update name counter on textarea input
    const studentTextarea = document.getElementById('students');
    const nameCountDiv = document.getElementById('nameCount');
    studentTextarea.addEventListener('input', () => {
      const names = studentTextarea.value
        .split('\n')
        .map(s => s.trim())
        .filter(s => s !== "");
      nameCountDiv.textContent = "Students: " + names.length;
    });

    function refreshNameCount() {
      const names = studentTextarea.value
        .split('\n')
        .map(s => s.trim())
        .filter(Boolean);
      nameCountDiv.textContent = 'Students: ' + names.length;
    }
    // Set initial count on load
    refreshNameCount();

    const layoutRadios = document.getElementsByName('layout');
    const gridOptions = document.getElementById('grid-options');
    const groupOptions = document.getElementById('group-options');

    function updateOptions() {
      const layout = document.querySelector('input[name="layout"]:checked').value;
      gridOptions.style.display = layout === 'grid' ? 'block' : 'none';
      groupOptions.style.display = layout === 'groups' ? 'block' : 'none';
    }
    layoutRadios.forEach(radio => radio.addEventListener('change', updateOptions));
    updateOptions();

    // --- Live update state ---
    let chartGenerated = false;
    let lastLayout = null;
    let lastGridRows = null;
    let lastGridCols = null;
    let lastGroupSize = null;

    function chartHasSeats() {
      return document.querySelectorAll('#chart .seat').length > 0;
    }

    function getSeatTextsInDOMOrder() {
      return Array.from(document.querySelectorAll('#chart .seat')).map(s => s.textContent || '');
    }

    function rebuildGridPreservingOrder(newRows, newCols) {
      const chartDiv = document.getElementById('chart');
      const existing = getSeatTextsInDOMOrder();
      const total = newRows * newCols;

      // Apply grid styles
      chartDiv.style.display = 'grid';
      chartDiv.style.gridTemplateColumns = `repeat(${newCols}, 100px)`;
      chartDiv.style.justifyContent = 'center';
      chartDiv.style.overflowX = 'auto';
      chartDiv.style.maxWidth = '100%';
      chartDiv.style.margin = '20px auto 0';

      // Rebuild DOM
      chartDiv.innerHTML = '';
      for (let i = 0; i < total; i++) {
        const seatDiv = document.createElement('div');
        seatDiv.classList.add('seat');
        seatDiv.draggable = true;
        seatDiv.id = 'seat-' + i;
        seatDiv.textContent = existing[i] || '';
        addDragDropHandlers(seatDiv);
        chartDiv.appendChild(seatDiv);
      }
      lastGridRows = newRows;
      lastGridCols = newCols;
    }

    function updateGroupsForSize(newSize) {
      const chartDiv = document.getElementById('chart');
      const groups = Array.from(chartDiv.querySelectorAll('.group'));
      let overflow = [];

      groups.forEach((group, gidx) => {
        const seatsContainer = group.querySelector('.group-seats');
        const seats = Array.from(seatsContainer.querySelectorAll('.seat'));
        const currentSize = seats.length;
        if (currentSize < newSize) {
          // add blanks at bottom
          for (let i = currentSize; i < newSize; i++) {
            const seatDiv = document.createElement('div');
            seatDiv.classList.add('seat');
            seatDiv.draggable = true;
            seatDiv.id = `group-${gidx}-seat-${i}`;
            seatDiv.textContent = '';
            addDragDropHandlers(seatDiv);
            seatsContainer.appendChild(seatDiv);
          }
        } else if (currentSize > newSize) {
          // collect overflow names and remove extra seat elements
          for (let i = newSize; i < currentSize; i++) {
            const s = seats[i];
            const name = (s.textContent || '').trim();
            if (name) overflow.push(name);
            seatsContainer.removeChild(s);
          }
        }
      });

      // First, distribute overflow into existing empty seats across all groups (in DOM order)
      if (overflow.length > 0) {
        const emptySeats = Array.from(chartDiv.querySelectorAll('.group .group-seats .seat'))
          .filter(s => !((s.textContent || '').trim()));
        for (let i = 0; i < emptySeats.length && overflow.length > 0; i++) {
          emptySeats[i].textContent = overflow.shift();
        }
      }
      // Create new group(s) for any overflow, filling top-down
      if (overflow.length > 0) {
        while (overflow.length > 0) {
          const firstSeat = appendNewGroupWithSize(newSize);
          const newGroup = firstSeat.closest('.group');
          const seats = Array.from(newGroup.querySelectorAll('.seat'));
          for (let i = 0; i < seats.length; i++) {
            seats[i].textContent = overflow.shift() || '';
            if (overflow.length === 0) break;
          }
        }
      }

      lastGroupSize = newSize;
    }

    // --- Live update listeners ---
    const rowsInput = document.getElementById('rows');
    const colsInput = document.getElementById('columns');
    const groupSizeInput = document.getElementById('groupSize');

    if (rowsInput) rowsInput.addEventListener('change', () => {
      if (!chartGenerated || currentLayout() !== 'grid' || !chartHasSeats()) return;
      const r = Math.max(1, parseInt(rowsInput.value) || 1);
      const c = Math.max(1, parseInt(colsInput.value) || 1);
      const filled = countFilledSeats();
      if (r * c < filled) {
        alert(`Cannot set grid to ${r}x${c}: ${filled} students are already placed.`);
        // revert to last valid values
        if (lastGridRows != null) rowsInput.value = lastGridRows;
        if (lastGridCols != null) colsInput.value = lastGridCols;
        return;
      }
      rebuildGridPreservingOrder(r, c);
    });

    if (colsInput) colsInput.addEventListener('change', () => {
      if (!chartGenerated || currentLayout() !== 'grid' || !chartHasSeats()) return;
      const r = Math.max(1, parseInt(rowsInput.value) || 1);
      const c = Math.max(1, parseInt(colsInput.value) || 1);
      const filled = countFilledSeats();
      if (r * c < filled) {
        alert(`Cannot set grid to ${r}x${c}: ${filled} students are already placed.`);
        // revert to last valid values
        if (lastGridRows != null) rowsInput.value = lastGridRows;
        if (lastGridCols != null) colsInput.value = lastGridCols;
        return;
      }
      rebuildGridPreservingOrder(r, c);
    });

    if (groupSizeInput) groupSizeInput.addEventListener('change', () => {
      if (!chartGenerated || currentLayout() !== 'groups' || !chartHasSeats()) return;
      const size = Math.max(1, parseInt(groupSizeInput.value) || 1);
      updateGroupsForSize(size);
    });

    // --- Helpers: currentLayout and appendNewGroupWithSize ---
    function currentLayout() {
      return document.querySelector('input[name="layout"]:checked').value;
    }
    function appendNewGroupWithSize(size) {
      const chartDiv = document.getElementById('chart');
      const existing = chartDiv.querySelectorAll('.group').length;
      const groupIndex = existing; // zero-based

      const groupDiv = document.createElement('div');
      groupDiv.classList.add('group');

      const header = document.createElement('div');
      header.classList.add('group-title');
      header.textContent = 'Group ' + (groupIndex + 1);
      header.contentEditable = 'true';
      header.title = 'Click to rename the group title';
      groupDiv.appendChild(header);

      const seatsContainer = document.createElement('div');
      seatsContainer.classList.add('group-seats');
      for (let i = 0; i < size; i++) {
        const seatDiv = document.createElement('div');
        seatDiv.classList.add('seat');
        seatDiv.draggable = true;
        seatDiv.id = `group-${groupIndex}-seat-${i}`;
        seatDiv.textContent = '';
        addDragDropHandlers(seatDiv);
        seatsContainer.appendChild(seatDiv);
      }
      groupDiv.appendChild(seatsContainer);
      chartDiv.appendChild(groupDiv);

      // Return the first seat element of the new group for convenience
      return seatsContainer.querySelector('.seat');
    }

    // --- Student Manager (modal) ---
    const manageBtn = document.getElementById('manageBtn');
    const modal = document.getElementById('studentModal');
    const studentListDiv = document.getElementById('studentList');
    const addStudentInput = document.getElementById('addStudentInput');
    const addStudentBtn = document.getElementById('addStudentBtn');
    const closeStudentModal = document.getElementById('closeStudentModal');

    function openStudentModal() {
      renderStudentManager();
      modal.style.display = 'flex';
    }
    function closeStudentManager() {
      modal.style.display = 'none';
    }
    if (manageBtn) manageBtn.addEventListener('click', openStudentModal);
    if (closeStudentModal) closeStudentModal.addEventListener('click', closeStudentManager);
    if (modal) modal.addEventListener('click', (e) => { if (e.target === modal) closeStudentManager(); });

    function getSeatElements() {
      return Array.from(document.querySelectorAll('#chart .seat'));
    }
    function countFilledSeats() {
      return getSeatElements().filter(s => (s.textContent || '').trim()).length;
    }
    function getStudentsFromList() {
      return studentTextarea.value
        .split('\n')
        .map(s => s.trim())
        .filter(Boolean);
    }

    function replaceNameEverywhere(oldName, newName) {
      if (!oldName || oldName === newName) return;
      // Update chart seats
      getSeatElements().forEach(seat => {
        if ((seat.textContent || '').trim() === oldName) seat.textContent = newName;
      });
      // Update textarea: replace every exact line match
      const lines = studentTextarea.value.split('\n');
      const updated = lines.map(line => (line.trim() === oldName ? newName : line));
      studentTextarea.value = updated.join('\n');
      refreshNameCount();
    }

    function deleteNameEverywhere(name) {
      if (!name) return;
      // Clear matching seats
      getSeatElements().forEach(seat => {
        if ((seat.textContent || '').trim() === name) seat.textContent = '';
      });
      // Remove exact matches from textarea
      const lines = studentTextarea.value.split('\n');
      const remaining = lines.filter(line => line.trim() !== name);
      studentTextarea.value = remaining.join('\n').replace(/\n+$/,'');
      refreshNameCount();
    }

    function firstEmptySeat() {
      const seats = getSeatElements();
      for (let i = 0; i < seats.length; i++) {
        const s = seats[i];
        if (!s.textContent || !s.textContent.trim()) return s;
      }
      return undefined;
    }

    function renderStudentManager() {
      const names = getStudentsFromList();
      // Unique with counts for a clean list
      const counts = new Map();
      names.forEach(n => counts.set(n, (counts.get(n) || 0) + 1));
      const rows = Array.from(counts.entries()).sort((a,b) => a[0].localeCompare(b[0]));

      studentListDiv.innerHTML = '';
      if (!rows.length) {
        const empty = document.createElement('div');
        empty.className = 'muted';
        empty.textContent = 'No students placed yet. Add students below or generate a chart.';
        studentListDiv.appendChild(empty);
      } else {
        rows.forEach(([name, count]) => {
          const row = document.createElement('div');
          row.className = 'student-row';
          const input = document.createElement('input');
          input.type = 'text';
          input.value = name;
          input.placeholder = 'Rename student';
          const renameBtn = document.createElement('button');
          renameBtn.textContent = 'Rename';
          const delBtn = document.createElement('button');
          delBtn.textContent = `Delete${count>1?` (${count})`:''}`;

          renameBtn.addEventListener('click', () => {
            const newName = (input.value || '').trim();
            if (!newName) return;
            replaceNameEverywhere(name, newName);
            renderStudentManager();
          });
          delBtn.addEventListener('click', () => {
            deleteNameEverywhere(name);
            renderStudentManager();
          });

          const label = document.createElement('div');
          label.textContent = `${name} ${count>1?`(x${count})`:''}`;
          // Replace label with input for clearer UX
          row.appendChild(input);
          row.appendChild(renameBtn);
          row.appendChild(delBtn);
          studentListDiv.appendChild(row);
        });
      }
    }

    if (addStudentBtn) {
      addStudentBtn.addEventListener('click', () => {
        const n = (addStudentInput.value || '').trim();
        if (!n) return;

        // Try to find an empty seat first (top-left to bottom-right)
        let empty = firstEmptySeat();
        if (!empty) {
          const layout = currentLayout();
          if (layout === 'groups') {
            // Auto-grow: add a new group and use its first seat
            const size = parseInt(document.getElementById('groupSize').value) || 4;
            empty = appendNewGroupWithSize(size);
          } else {
            alert('Error: There are more students than available seats.\nIncrease rows/columns and Generate again.');
            return;
          }
        }

        // Update textarea list and count
        const current = studentTextarea.value.trim();
        studentTextarea.value = current ? (current + '\n' + n) : n;
        refreshNameCount();

        // Place the student
        empty.textContent = n;
        addStudentInput.value = '';
        renderStudentManager();
      });
    }


document.getElementById('generate').addEventListener('click', () => {
  const studentInput = studentTextarea.value;
  let students = studentInput.split('\n').map(s => s.trim()).filter(s => s !== "");
  if (students.length === 0) {
    alert('Please enter at least one student.');
    return;
  }
  // Shuffle students randomly
  students = students.sort(() => Math.random() - 0.5);

  const layout = document.querySelector('input[name="layout"]:checked').value;
  const chartDiv = document.getElementById('chart');
  chartDiv.innerHTML = '';
  if (manageBtn) manageBtn.style.display = 'inline-block';
  const classTitleEl = document.getElementById('classTitle');
  if (classTitleEl) classTitleEl.style.display = 'block';

  if (layout === 'grid') {
    const rows = parseInt(document.getElementById('rows').value);
    const cols = parseInt(document.getElementById('columns').value);
    const totalSeats = rows * cols;
    if (students.length > totalSeats) {
      const extra = students.length - totalSeats;
      alert("Error: There are " + extra + " more student(s) than available seats.");
      return;
    }

    // Set up CSS Grid for seating chart
    chartDiv.style.display = 'grid';
    chartDiv.style.gridTemplateColumns = `repeat(${cols}, 100px)`;
    chartDiv.style.justifyContent = 'center';
    chartDiv.style.overflowX = 'auto';
    chartDiv.style.maxWidth = '100%';
    chartDiv.style.margin = '20px auto 0';

    for (let i = 0; i < totalSeats; i++) {
      const seatDiv = document.createElement('div');
      seatDiv.classList.add('seat');
      seatDiv.draggable = true;
      seatDiv.id = 'seat-' + i;
      seatDiv.textContent = students[i] || '';
      addDragDropHandlers(seatDiv);
      chartDiv.appendChild(seatDiv);
    }
    // --- set live update state ---
    chartGenerated = true;
    lastLayout = 'grid';
    lastGridRows = rows;
    lastGridCols = cols;
  } else if (layout === 'groups') {
    // RESET any grid styles from previous layout
    chartDiv.style.display = 'flex';
    chartDiv.style.flexWrap = 'wrap';
    chartDiv.style.gridTemplateColumns = '';
    chartDiv.style.overflowX = '';
    chartDiv.style.justifyContent = 'center';
    chartDiv.style.maxWidth = '';
    chartDiv.style.margin = '20px auto 0';

    const groupSize = parseInt(document.getElementById('groupSize').value);
    const totalGroups = Math.ceil(students.length / groupSize);
    for (let g = 0; g < totalGroups; g++) {
      const groupDiv = document.createElement('div');
      groupDiv.classList.add('group');
      const header = document.createElement('div');
      header.classList.add('group-title');
      header.textContent = 'Group ' + (g + 1);
      header.contentEditable = 'true';
      header.title = 'Click to rename the group title';
      groupDiv.appendChild(header);

      const seatsContainer = document.createElement('div');
      seatsContainer.classList.add('group-seats');

      const start = g * groupSize;
      const groupStudents = students.slice(start, start + groupSize);
      for (let idx = 0; idx < groupSize; idx++) {
        const seatDiv = document.createElement('div');
        seatDiv.classList.add('seat');
        seatDiv.draggable = true;
        seatDiv.id = 'group-' + g + '-seat-' + idx;
        seatDiv.textContent = groupStudents[idx] || '';
        addDragDropHandlers(seatDiv);
        seatsContainer.appendChild(seatDiv);
      }

      groupDiv.appendChild(seatsContainer);
      chartDiv.appendChild(groupDiv);
    }
    // --- set live update state ---
    chartGenerated = true;
    lastLayout = 'groups';
    lastGroupSize = groupSize;
  }
});

    function addDragDropHandlers(el) {
      el.addEventListener('dragstart', dragStart);
      el.addEventListener('dragover', dragOver);
      el.addEventListener('drop', drop);
      el.addEventListener('dragend', dragEnd);
    }

    let draggedElement = null;
    function dragStart(e) {
      draggedElement = this;
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", this.id);
      this.style.opacity = '0.4';
    }
    function dragOver(e) {
      e.preventDefault();
      return false;
    }
    function drop(e) {
      e.stopPropagation();
      if (draggedElement !== this) {
        let temp = this.textContent;
        this.textContent = draggedElement.textContent;
        draggedElement.textContent = temp;
      }
      return false;
    }
    function dragEnd(e) {
      this.style.opacity = '1';
    }
    document.getElementById('printBtn').addEventListener('click', () => {
      window.print();
    });

    // --- Save/Load support (File-based with schema) ---
    const SCHEMA_ID = 'seatingchart.v1';

    function buildStateFromDOM() {
      const layout = document.querySelector('input[name="layout"]:checked').value;
      const studentsText = studentTextarea.value;
      const titleEl = document.getElementById('classTitle');
      const className = titleEl ? titleEl.textContent.trim() : '';
      const state = { layout, studentsText, className, timestamp: Date.now() };

      const chartDiv = document.getElementById('chart');

      if (layout === 'grid') {
        const rows = parseInt(document.getElementById('rows').value);
        const cols = parseInt(document.getElementById('columns').value);
        const seats = Array.from(chartDiv.querySelectorAll('.seat')).map(s => s.textContent.trim());
        Object.assign(state, { rows, cols, seats });
      } else {
        const groupSizeVal = parseInt(document.getElementById('groupSize').value);
        const groupNodes = Array.from(chartDiv.querySelectorAll('.group'));
        const groups = groupNodes.map(group => {
          const titleEl = group.querySelector('.group-title');
          const title = titleEl ? titleEl.textContent : '';
          const seats = Array.from(group.querySelectorAll('.group-seats .seat')).map(s => s.textContent.trim());
          return { title, seats };
        });
        Object.assign(state, { groupSize: groupSizeVal, groups});
      }
      return state;
    }

    function stateForSave() {
      const core = buildStateFromDOM();
      // Embed schema id so a future loader can validate/infer
      return { schema: SCHEMA_ID, ...core };
    }

    function clearChart() {
      const chartDiv = document.getElementById('chart');
      chartDiv.innerHTML = '';
    }

    function renderFromState(state) {
      if (!state) return;

      // If schema missing, try to infer
      const layout = state.layout || (Array.isArray(state.groups) ? 'groups' : 'grid');
      state.layout = layout;

      // Restore textarea text for convenience (does not affect rendering)
      if (typeof state.studentsText === 'string') {
        studentTextarea.value = state.studentsText;
        const names = state.studentsText.split('\n').map(s => s.trim()).filter(Boolean);
        nameCountDiv.textContent = 'Students: ' + names.length;
      }

      // Set layout radio and show proper options
      const layoutRadio = document.querySelector(`input[name="layout"][value="${layout}"]`);
      if (layoutRadio) layoutRadio.checked = true;
      updateOptions();

      const chartDiv = document.getElementById('chart');
      clearChart();
      const titleEl = document.getElementById('classTitle');
      if (titleEl && typeof state.className === 'string' && state.className.trim() !== '') {
        titleEl.textContent = state.className.trim();
      }

      if (layout === 'grid') {
        const rows = parseInt(state.rows) || 1;
        const cols = parseInt(state.cols) || 1;

        chartDiv.style.display = 'grid';
        chartDiv.style.gridTemplateColumns = `repeat(${cols}, 100px)`;
        chartDiv.style.justifyContent = 'center';
        chartDiv.style.overflowX = 'auto';
        chartDiv.style.maxWidth = '100%';
        chartDiv.style.margin = '20px auto 0';

        document.getElementById('rows').value = rows;
        document.getElementById('columns').value = cols;

        const totalSeats = rows * cols;
        const seats = Array.isArray(state.seats) ? state.seats : [];
        for (let i = 0; i < totalSeats; i++) {
          const seatDiv = document.createElement('div');
          seatDiv.classList.add('seat');
          seatDiv.draggable = true;
          seatDiv.id = 'seat-' + i;
          seatDiv.textContent = seats[i] || '';
          addDragDropHandlers(seatDiv);
          chartDiv.appendChild(seatDiv);
        }
        // --- set live update state ---
        chartGenerated = true;
        lastLayout = 'grid';
        lastGridRows = rows;
        lastGridCols = cols;
      } else {
        chartDiv.style.display = 'flex';
        chartDiv.style.flexWrap = 'wrap';
        chartDiv.style.gridTemplateColumns = '';
        chartDiv.style.overflowX = '';
        chartDiv.style.justifyContent = 'center';
        chartDiv.style.maxWidth = '';
        chartDiv.style.margin = '20px auto 0';

        const groups = Array.isArray(state.groups) ? state.groups : [];
        // Restore (or infer) group size and update UI control accordingly
        const inferredSize = (groups[0] && Array.isArray(groups[0].seats)) ? groups[0].seats.length : undefined;
        const parsedSaved = parseInt(state.groupSize);
        const sizeToUse = (!isNaN(parsedSaved) && parsedSaved > 0) ? parsedSaved : (inferredSize || parseInt(document.getElementById('groupSize').value) || 4);
        document.getElementById('groupSize').value = sizeToUse;

        groups.forEach((g, idx) => {
          const groupDiv = document.createElement('div');
          groupDiv.classList.add('group');

          const header = document.createElement('div');
          header.classList.add('group-title');
          header.textContent = (g && typeof g.title === 'string' && g.title.trim() !== '') ? g.title : ('Group ' + (idx + 1));
          header.contentEditable = 'true';
          header.title = 'Click to rename the group title';
          groupDiv.appendChild(header);

          const seatsContainer = document.createElement('div');
          seatsContainer.classList.add('group-seats');

          const seats = Array.isArray(g && g.seats) ? g.seats : [];
          for (let i = 0; i < sizeToUse; i++) {
            const seatDiv = document.createElement('div');
            seatDiv.classList.add('seat');
            seatDiv.draggable = true;
            seatDiv.id = `group-${idx}-seat-${i}`;
            seatDiv.textContent = seats[i] || '';
            addDragDropHandlers(seatDiv);
            seatsContainer.appendChild(seatDiv);
          }

          groupDiv.appendChild(seatsContainer);
          chartDiv.appendChild(groupDiv);
        });
        // --- set live update state ---
        chartGenerated = true;
        lastLayout = 'groups';
        lastGroupSize = sizeToUse;
      }
    }

    function downloadJSON(filename, dataObj) {
      const blob = new Blob([JSON.stringify(dataObj, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    function buildTimestamp() {
      const d = new Date();
      const pad = n => String(n).padStart(2, '0');
      const yyyy = d.getFullYear();
      const mm = pad(d.getMonth() + 1);
      const dd = pad(d.getDate());
      const HH = pad(d.getHours());
      const MM = pad(d.getMinutes());
      const SS = pad(d.getSeconds());
      return `${yyyy}-${mm}-${dd}_${HH}-${MM}-${SS}`;
    }

    function defaultFileName() {
      const titleEl = document.getElementById('classTitle');
      const raw = titleEl ? titleEl.textContent.trim() : '';
      const isDefault = !raw || /^class name$/i.test(raw);
      let base;
      if (isDefault) {
        base = `seating-chart_${buildTimestamp()}`;
      } else {
        base = `${raw}_seating-chart`;
      }
      const safe = base.replace(/[^a-z0-9-_]+/gi, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
      return `${safe}.json`;
    }

    // Buttons / File input
    const saveBtn = document.getElementById('saveBtn');
    const loadBtn = document.getElementById('loadBtn');
    const loadFile = document.getElementById('loadFile');

if (saveBtn) {
  saveBtn.addEventListener('click', () => {
    const state = stateForSave();
    const fname = defaultFileName();
    downloadJSON(fname, state);
  });
}

    if (loadBtn && loadFile) {
      loadBtn.addEventListener('click', () => {
        loadFile.click();
      });

      loadFile.addEventListener('change', async (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        try {
          const text = await file.text();
          const obj = JSON.parse(text);
          if (obj.studentsText) {
            studentTextarea.value = obj.studentsText;
            const names = obj.studentsText.split('\n').map(s => s.trim()).filter(Boolean);
            nameCountDiv.textContent = 'Students: ' + names.length;
          }
          if (typeof obj.className === 'string') {
            const titleEl = document.getElementById('classTitle');
            if (titleEl) titleEl.textContent = obj.className.trim() || 'Class Name';
          }
          // Validate schema loosely; if absent, attempt to infer
          if (obj && (obj.schema === SCHEMA_ID || obj.layout || obj.groups || obj.seats)) {
            renderFromState(obj);
          } else {
            alert('Unrecognized file format.');
          }
        } catch (err) {
          console.error(err);
          alert('Failed to read or parse that file.');
        } finally {
          // Reset input so same file can be loaded again if needed
          e.target.value = '';
        }
      });
    }
  </script>
</body>
